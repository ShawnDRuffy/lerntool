<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>Lerntool</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="katex/katex.min.css">
  <script src="config.js"></script>
  <script src="katex/katex.min.js" defer></script>
  <script src="grafik.js" defer></script>
  <script src="inhalt.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="kopf">
    <div class="kopf-innen">
      <h1>Lerntool</h1>
      <button id="abmelden" class="leise" hidden>Abmelden</button>
    </div>
  </header>

  <main id="inhalt">
    <form id="anmelden" class="karte anmelden" hidden>
      <h2>Anmelden</h2>
      <p class="klein">Mit dem Konto, das du in Supabase angelegt hast.</p>
      <label>E-Mail <input type="email" name="email" autocomplete="username" required></label>
      <label>Passwort <input type="password" name="passwort" autocomplete="current-password" required></label>
      <button type="submit">Anmelden</button>
      <p id="anmelden-fehler" class="fehler" role="alert"></p>
    </form>

    <section id="start" hidden>
      <nav aria-label="Lernen"><a href="einheit.html">Lerneinheit</a> · <a href="befragung.html">Befragung</a></nav>
      <div id="pruefungen" class="pruefungen"></div>
      <h2>Als Nächstes</h2>
      <ol id="naechstes" class="termine"></ol>
      <h2>Fächer</h2>
      <div id="faecher" class="faecher"></div>
    </section>

    <section id="chat" hidden>
      <button id="zurueck" class="leise">Alle Fächer</button>
      <h2 id="chat-titel"></h2>
      <div id="verlauf" class="verlauf" aria-live="polite"></div>
      <form id="frage" class="eingabe">
        <textarea name="text" rows="2" maxlength="8000" placeholder="Frag etwas zu diesem Fach" required></textarea>
        <button type="submit">Senden</button>
      </form>
    </section>

    <p id="hinweis" class="hinweis" hidden></p>
  </main>
</body>
</html>
